name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/moment-apk-*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test production timing algorithms
        run: sh tools/test-core.sh
      - name: Compile, unit test and package
        run: gradle --no-daemon --max-workers=2 --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Android lint
        run: gradle --no-daemon --max-workers=2 :app:lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moment-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
